<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Charging | Admin Dashboard</title>
    <style>
        /* Directive 34: Cohesive Design Tokens */
        :root { --primary: #007BFF; --bg: #f4f4f4; --text: #333; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 32px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 15px 30px; margin-top: 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        #output { margin-top: 20px; padding: 15px; background: #e9ecef; border-left: 5px solid var(--primary); font-family: monospace; white-space: pre-wrap; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IT Charging Admin</h1>
        <label>Article Title</label>
        <input type="text" id="title" placeholder="Enter title...">
        
        <label>Meta Description (SEO)</label>
        <textarea id="desc" rows="3" placeholder="Describe the article (120+ characters)..."></textarea>
        
        <label>YouTube Video ID</label>
        <input type="text" id="video" placeholder="e.g., dQw4w9WgXcQ">
        
        <button onclick="generateData()">Generate JSON & Audit</button>
        
        <div id="output">JSON data will appear here...</div>
    </div>

    <script>
        function generateData() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const video = document.getElementById('video').value;

            // SEO Audit Logic (Directive 32)
            const seoStatus = desc.length >= 120 ? "✅ SEO Ready" : "⚠️ SEO Warning: Meta description is too short.";

            const postData = {
                title: title,
                seo: { metaDescription: desc },
                video: video ? { provider: "youtube", id: video } : null,
                performance: "Optimized (Lazy Loading Enabled)"
            };

            document.getElementById('output').innerText = 
                `STATUS: ${seoStatus}\n\n` + JSON.stringify(postData, null, 2);
        }
    </script>
</body>
</html>
