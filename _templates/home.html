<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{SITE_NAME}} — {{SITE_TAGLINE}}</title>
<meta name="description" content="{{SITE_TAGLINE}}" />
<link rel="canonical" href="{{SITE_URL}}/" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
<meta property="og:url" content="{{SITE_URL}}/" />
<meta property="og:title" content="{{SITE_NAME}} — {{SITE_TAGLINE}}" />
<meta property="og:description" content="{{SITE_TAGLINE}}" />
<meta property="og:image" content="{{SITE_LOGO}}" />
<link rel="icon" href="{{SITE_FAVICON}}" />
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"{{SITE_NAME}}","url":"{{SITE_URL}}","logo":"{{SITE_LOGO}}"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family={{FONT_DISPLAY}}:wght@500;600;700&family={{FONT_BODY}}:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{DEPTH}}css/style.css?v=14" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE_ID}}" crossorigin="anonymous"></script>
<style>
.hp-wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.hp-hero{display:grid;grid-template-columns:220px 1fr 340px;gap:0;border-bottom:1px solid var(--color-rule);margin-bottom:2rem}
.hp-latest{padding:1.5rem 1.5rem 1.5rem 0;border-right:1px solid var(--color-rule)}
.hp-latest__label{font-family:var(--font-display);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink);border-bottom:2px solid var(--color-ink);padding-bottom:.5rem;margin-bottom:1rem}
.hp-latest__list{list-style:none}
.hp-latest__item{padding:.75rem 0;border-bottom:1px solid var(--color-rule)}
.hp-latest__item:last-child{border-bottom:none}
.hp-latest__item a{font-family:var(--font-display);font-size:.82rem;font-weight:600;color:var(--color-ink);text-decoration:none;line-height:1.35;display:block;margin-bottom:.2rem}
.hp-latest__item a:hover{color:var(--color-red)}
.hp-latest__time{font-size:.7rem;color:var(--color-slate);text-transform:uppercase;letter-spacing:.05em}
.hp-hero__img{padding:1.5rem}
.hp-hero__img a{display:block}
.hp-hero__img img{width:100%;height:320px;object-fit:cover;display:block}
.hp-hero__img-placeholder{width:100%;height:320px;background:var(--color-paper);border:1px solid var(--color-rule)}
.hp-hero__text{padding:1.5rem 0 1.5rem 1.5rem;border-left:1px solid var(--color-rule);display:flex;flex-direction:column;justify-content:center}
.hp-hero__cat{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--color-red);margin-bottom:.6rem}
.hp-hero__title{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1.15;color:var(--color-ink);margin-bottom:.8rem}
.hp-hero__title a{color:inherit;text-decoration:none}
.hp-hero__title a:hover{color:var(--color-red)}
.hp-hero__excerpt{font-size:.92rem;color:var(--color-slate);line-height:1.6;margin-bottom:1rem}
.hp-grid-label{font-family:var(--font-display);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink);border-bottom:2px solid var(--color-ink);padding-bottom:.5rem;margin-bottom:1.2rem}
.hp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.hp-card{display:grid;grid-template-columns:1fr 120px;gap:1rem;padding:1.2rem 0;border-bottom:1px solid var(--color-rule);align-items:start}
.hp-card:nth-child(odd){padding-right:2rem;border-right:1px solid var(--color-rule)}
.hp-card:nth-child(even){padding-left:2rem}
.hp-card__cat{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--color-red);margin-bottom:.4rem}
.hp-card__title{font-family:var(--font-display);font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:.4rem}
.hp-card__title a{color:var(--color-ink);text-decoration:none}
.hp-card__title a:hover{color:var(--color-red)}
.hp-card__thumb{width:120px;height:90px;object-fit:cover;display:block}
.hp-card__thumb-placeholder{width:120px;height:90px;background:var(--color-paper);border:1px solid var(--color-rule)}
.hp-empty{padding:4rem;text-align:center;color:var(--color-slate);font-size:.9rem}
@media(max-width:900px){
  .hp-hero{grid-template-columns:1fr}
  .hp-latest{border-right:none;border-bottom:1px solid var(--color-rule);padding:1rem 0}
  .hp-hero__img{padding:1rem 0}
  .hp-hero__img img{height:220px}
  .hp-hero__text{border-left:none;border-top:1px solid var(--color-rule);padding:1rem 0}
  .hp-hero__title{font-size:1.4rem}
  .hp-grid{grid-template-columns:1fr}
  .hp-card{grid-template-columns:1fr 90px}
  .hp-card:nth-child(odd){padding-right:0;border-right:none}
  .hp-card:nth-child(even){padding-left:0}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <button class="icon-btn nav-toggle" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2.2"/></svg>
    </button>
    <a class="brand" href="{{DEPTH}}index.html">
      <img src="{{SITE_LOGO}}" alt="{{SITE_NAME}} logo" />
      <span class="brand__name">{{SITE_NAME}}</span>
    </a>
    <nav class="primary-nav" aria-label="Primary"><ul>{{NAV_LINKS}}</ul></nav>
    <div class="header-actions">
      <button class="icon-btn search-toggle" aria-label="Open search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="search-panel">
    <div class="wrap">
      <form role="search" action="#" method="get">
        <svg class="search-panel__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" name="q" placeholder="Search {{SITE_NAME}}…" aria-label="Search" autofocus />
        <button type="submit">Search</button>
        <button type="button" class="search-close" aria-label="Close search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
    </div>
  </div>
  <div class="site-menu" id="siteMenu">
    <div class="site-menu__head">
      <span class="site-menu__title">Menu</span>
      <button class="icon-btn menu-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="site-menu__scroll" aria-label="Site menu">
      <ul class="site-menu__primary">{{MOBILE_NAV}}</ul>
    </nav>
  </div>
</header>

<main id="main">
  <div class="hp-wrap" style="padding-top:1.5rem">
    <section class="hp-hero">{{HERO_HTML}}</section>
    <section style="margin-top:2rem">
      <div class="hp-grid-label">Latest Articles</div>
      <div class="hp-grid">{{GRID_HTML}}</div>
    </section>
  </div>
</main>

<footer class="site-footer">{{FOOTER_HTML}}</footer>
<script src="{{DEPTH}}js/script.js"></script>
</body>
</html>
