<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{CAT_LABEL}} Articles | {{SITE_NAME}}</title>
<meta name="description" content="Browse all {{CAT_LABEL}} coverage on {{SITE_NAME}}." />
<link rel="canonical" href="{{SITE_URL}}/category/{{CAT_SLUG}}/" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
<meta property="og:url" content="{{SITE_URL}}/category/{{CAT_SLUG}}/" />
<meta property="og:title" content="{{CAT_LABEL}} | {{SITE_NAME}}" />
<link rel="icon" href="{{SITE_FAVICON}}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family={{FONT_DISPLAY}}:wght@500;600;700&family={{FONT_BODY}}:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{DEPTH}}css/style.css?v=14" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE_ID}}" crossorigin="anonymous"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <button class="icon-btn nav-toggle" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2.2"/></svg>
    </button>
    <a class="brand" href="{{DEPTH}}index.html">
      <img src="{{SITE_LOGO}}" alt="{{SITE_NAME}} logo" />
      <span class="brand__name">{{SITE_NAME}}</span>
    </a>
    <nav class="primary-nav" aria-label="Primary"><ul>{{NAV_LINKS}}</ul></nav>
    <div class="header-actions">
      <button class="icon-btn search-toggle" aria-label="Open search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="search-panel">
    <div class="wrap">
      <form role="search" action="#" method="get">
        <svg class="search-panel__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" name="q" placeholder="Search {{SITE_NAME}}…" aria-label="Search" autofocus />
        <button type="submit">Search</button>
        <button type="button" class="search-close" aria-label="Close search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
    </div>
  </div>
  <div class="site-menu" id="siteMenu">
    <div class="site-menu__head">
      <span class="site-menu__title">Menu</span>
      <button class="icon-btn menu-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="site-menu__scroll" aria-label="Site menu">
      <ul class="site-menu__primary">{{MOBILE_NAV}}</ul>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap category-head">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="{{DEPTH}}index.html">Home</a></li><li aria-current="page">{{CAT_LABEL}}</li></ol>
    </nav>
    <span class="eyebrow">Category</span>
    <h1>{{CAT_LABEL}}</h1>
    <span class="category-head__count">{{CAT_COUNT}} articles</span>
  </div>
  <div class="wrap card-grid">
    {{CARDS}}
  </div>
</main>

<footer class="site-footer">{{FOOTER_HTML}}</footer>
<script src="{{DEPTH}}js/script.js"></script>
</body>
</html>
